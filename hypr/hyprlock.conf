background {
    monitor =
    path = screenshot
    #path = $HOME/Pictures/Wallpapers/3.png
    #color = $background
    blur_passes = 1
    blur_size = 3
    contrast = 1
    brightness = 0.7
    vibrancy = 0.16
    vibrancy_darkness = 0.1
}

input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.35 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    placeholder_text =
    fail_text = otkazano
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(0, 0, 0, 0.2)
    font_color = rgba(253, 255, 254, 0.8)
    font_family = JetBrains Mono Nerd Font
    check_color = rgb(204, 136, 34)
    position = 0, -200
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgba(253, 255, 254, 0.9)
    font_size = 22
    shadow_passes = 1
    shadow_size = 5
    shadow_boost = 1.2
    font_family = JetBrains Mono Nerd Font
    position = 0, 300
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(253, 255, 254, 0.9)
    font_size = 95
    font_family = JetBrains Mono Nerd Font Extrabold
    position = 0, 180
    halign = center
    valign = center
}


